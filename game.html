<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العبها صح واربح!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f7c948;--green:#1fa75a;--red:#d63646;--orange:#f08a1c;--line:#8a93ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#fff;direction:rtl;
  background:radial-gradient(ellipse at 50% 0,#2b2bb0 0,#0b0b4a 55%,#03031f 100%) fixed;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:#fff}
button:disabled{cursor:default}
h1,h3{margin:0}

/* ---------- شاشة البداية ---------- */
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.card{background:rgba(10,10,70,.78);border:2px solid var(--gold);border-radius:24px;padding:32px;max-width:620px;width:100%;
  box-shadow:0 0 70px rgba(247,201,72,.25)}
.logo{font-size:clamp(36px,7vw,68px);font-weight:900;color:var(--gold);text-align:center;
  text-shadow:0 0 28px rgba(247,201,72,.65);line-height:1.2}
.sub{text-align:center;opacity:.85;margin:6px 0 24px}
.card h3{margin:14px 0 8px;color:var(--gold)}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow input,select{flex:1;font:inherit;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);
  background:#0a0e66;color:#fff}
.ghost{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:16px}
.ghost:hover:not(:disabled){border-color:var(--gold)}
.ghost:disabled{opacity:.4}
.big{display:block;width:100%;margin-top:22px;padding:16px;font-size:26px;font-weight:900;border-radius:60px;
  border:3px solid #ffe08a;background:linear-gradient(#f9d35a,#d99a12);color:#241600;box-shadow:0 6px 24px rgba(247,201,72,.4)}
.big:hover:not(:disabled){filter:brightness(1.08)}
.big:disabled{opacity:.4;filter:grayscale(.5)}
.rowlab{display:flex;align-items:center;gap:12px;margin-top:10px}
.rowlab select{max-width:180px}
.tips{margin:18px 0 0;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.07);font-size:14px;line-height:1.9;opacity:.9}

/* ---------- شاشة اللعب ---------- */
#game{height:100vh;display:grid;grid-template-columns:1fr 250px;grid-template-rows:auto 1fr auto;gap:12px;padding:12px;
  grid-template-areas:"top top" "main ladder" "foot foot"}
.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:26px;color:var(--gold);text-shadow:0 0 14px rgba(247,201,72,.5)}
.lifelines{display:flex;gap:10px;margin-inline-start:auto}
.ll{position:relative;min-width:96px;height:62px;border-radius:50%/50%;border:2px solid var(--gold);
  background:linear-gradient(#1c2bb8,#0b1370);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px}
.ll .ic{font-size:20px;font-weight:900;line-height:1.1}
.ll small{font-size:11px;opacity:.9}
.ll:hover:not(:disabled){box-shadow:0 0 18px rgba(247,201,72,.7)}
.ll:disabled:not(.used){opacity:.45}
.ll.used{opacity:.85}
.ll.used::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:#ff4b5c;
  background:rgba(0,0,20,.6);border-radius:inherit}
.main{grid-area:main;display:flex;flex-direction:column;gap:10px;min-height:0}
.meta{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
.meta .val{color:var(--gold);font-size:22px}
.timer{height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.timer>i{display:block;height:100%;background:var(--gold);transition:width .25s linear,background .3s}
.timer>i.low{background:#ff4b5c}
.qbox{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;
  font-size:clamp(24px,3.6vw,48px);line-height:1.5;padding:22px;border:3px solid var(--gold);border-radius:20px;
  background:linear-gradient(#0d0d60,#06063a);box-shadow:inset 0 0 40px rgba(60,60,200,.35)}
.msg{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;
  padding:6px 14px;border-radius:12px}
.msg.good{background:rgba(31,167,90,.3);color:#b8ffd6}
.msg.bad{background:rgba(214,54,70,.3);color:#ffc2c9}
.msg.warn{background:rgba(240,138,28,.25);color:#ffe0b0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 24px;font-size:clamp(18px,2.3vw,30px);font-weight:700;color:#fff;
  border:3px solid var(--line);border-radius:60px;background:linear-gradient(#10208f,#091060);text-align:start;transition:.2s}
.opt b{color:var(--gold);font-size:1.15em}
.opt:hover:not(:disabled){border-color:var(--gold);transform:scale(1.015)}
.opt.sel,.opt.locked{background:linear-gradient(#f7b034,#c96d0a);color:#1a1000;border-color:#ffd88a}
.opt.sel b,.opt.locked b{color:#1a1000}
.opt.locked{animation:pulse .6s infinite alternate}
.opt.correct{background:linear-gradient(#32d47b,#12803f);border-color:#a8ffcb;color:#fff}
.opt.correct b{color:#fff}
.opt.wrong{background:linear-gradient(#ee4b5a,#9c1626);border-color:#ffb3bb}
.opt.wrong b{color:#fff}
.opt.gone{opacity:.1}
.opt.dim{opacity:.45}
@keyframes pulse{from{box-shadow:0 0 0 rgba(247,176,52,0)}to{box-shadow:0 0 30px rgba(247,176,52,.9)}}
.actions{display:flex;gap:12px;justify-content:center;min-height:56px}
.actions .big{margin:0;width:auto;min-width:260px;font-size:22px;padding:10px 28px}
.ladder{grid-area:ladder;display:flex;flex-direction:column;gap:4px;overflow:auto;background:rgba(0,0,40,.55);
  border:2px solid rgba(247,201,72,.5);border-radius:16px;padding:10px}
.step{display:flex;align-items:center;gap:8px;padding:3px 10px;border-radius:8px;font-weight:700;font-size:15px;flex:1;min-height:24px}
.step .n{width:24px;color:var(--gold)}
.step .v{flex:1}
.step .w{font-size:12px;opacity:.95;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.cur{background:var(--gold);color:#1a1000}
.step.cur .n{color:#1a1000}
.step.done{color:#a8ffcb}
.step.fail{opacity:.45}
.players{grid-area:foot;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pl{min-width:130px;padding:6px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(10,10,80,.85);text-align:center;transition:.2s}
.pl .k{font-size:11px;opacity:.65;line-height:1}
.pl .nm{font-weight:800;font-size:17px}
.pl .sc{color:var(--gold);font-weight:900;font-size:18px;line-height:1.1}
.pl:hover:not(:disabled){border-color:var(--gold)}
.pl.active{border-color:#ffe08a;background:linear-gradient(#f7b034,#c96d0a);color:#1a1000;box-shadow:0 0 26px rgba(247,201,72,.75)}
.pl.active .sc{color:#1a1000}
.pl.out{opacity:.3;text-decoration:line-through}

/* ---------- نوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,25,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#0b0b5a;border:3px solid var(--gold);border-radius:22px;padding:28px;min-width:min(520px,92vw);text-align:center;
  box-shadow:0 0 60px rgba(247,201,72,.3)}
.modal h2{margin:0 0 6px;color:var(--gold);font-size:30px}
.bars{display:flex;gap:20px;align-items:flex-end;justify-content:center;height:230px;margin:18px 0 6px}
.bar{width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-weight:800;gap:4px}
.bar i{display:block;width:100%;background:linear-gradient(#ffd966,#d9941a);border-radius:8px 8px 0 0;height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.bar.gone i{background:#333}
.bar .l{font-size:24px;color:var(--gold)}
.callnum{font-size:96px;font-weight:900;color:var(--gold);line-height:1.1}
.callnum.low{color:#ff4b5c}

/* ---------- النتيجة ---------- */
.rank{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.08);margin:8px 0;font-size:22px;font-weight:800}
.rank.first{background:linear-gradient(#f7c948,#c98a0a);color:#241600;font-size:28px}
.rank .m{font-size:32px;width:44px;text-align:center}
.rank .nm{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#d63646;padding:10px 22px;border-radius:12px;font-weight:800;z-index:80}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (max-width:900px){
  body{overflow:auto}
  #game{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-areas:"top" "main" "foot"}
  .ladder{display:none}
  .opts{grid-template-columns:1fr}
  .lifelines{margin-inline-start:0;flex-wrap:wrap}
}

/* ================= ثيم الإطارات الفضية (زي الصورة المرجعية) ================= */
:root{--silver:linear-gradient(180deg,#fafafd 0%,#a9a9b8 45%,#ececf3 60%,#8b8b9c 100%);--ora:#f59a23;--inb:rgba(15,9,72,.95);--sv:#d4d4e2}
body{background:
  radial-gradient(ellipse at 88% 8%,rgba(125,75,225,.5),transparent 55%),
  linear-gradient(135deg,#06061f 0%,#190f55 55%,#2c1a78 100%) fixed}
#game{grid-template-columns:1fr;grid-template-areas:"top" "main" "foot";padding:10px 0;gap:10px}
.top,.players{padding:0 20px}
.brand{color:#fff;text-shadow:0 0 16px rgba(160,120,255,.7)}
.logo{color:var(--ora);text-shadow:0 0 28px rgba(245,154,35,.5)}
.card{border-color:var(--sv);box-shadow:0 0 70px rgba(130,90,255,.4);background:rgba(14,9,72,.88)}
.card h3,.meta .val,.opt b,.bar .l{color:var(--ora)}
.big{background:linear-gradient(#ffb74d,#e07f10);border-color:#ffdca6;color:#2a1500;box-shadow:0 6px 24px rgba(245,154,35,.4)}
.modal{border-color:var(--sv);background:#120a5c;box-shadow:0 0 60px rgba(130,90,255,.45)}
.modal h2{color:var(--ora)}
.callnum{color:var(--ora)}
.bar i{background:linear-gradient(#ffc766,#e07f10)}

/* الإطار */
.frame{display:block;position:relative;padding:3px;background:var(--silver);
  clip-path:polygon(34px 0,calc(100% - 34px) 0,100% 50%,calc(100% - 34px) 100%,34px 100%,0 50%)}
.frame>.in{display:flex;align-items:center;height:100%;background:var(--inb);
  clip-path:polygon(33px 0,calc(100% - 33px) 0,100% 50%,calc(100% - 33px) 100%,33px 100%,0 50%)}

/* السؤال */
.qbox{display:none}
.qwrap{flex:1;display:flex;align-items:center;min-height:130px}
.qrow{display:flex;align-items:center;width:100%}
.qrow::before,.qrow::after{content:"";flex:1;height:3px;background:var(--silver)}
.frame.q{flex:0 0 min(1150px,84%);height:clamp(110px,19vh,160px)}
.frame.q>.in{justify-content:center;text-align:center;font-weight:800;font-size:clamp(22px,3.4vw,46px);
  line-height:1.5;padding:8px 64px;color:#fff}

/* الإجابات */
.meta,.msg,.actions{margin-inline:22px}
.timer{margin-inline:22px}
.opts{gap:14px 0}
.opt{display:flex;align-items:center;gap:0;padding:0;border:0;border-radius:0;background:none;color:#fff;transform:none!important;animation:none!important}
.opt::before,.opt::after{content:"";flex:1;height:3px;background:var(--silver)}
.opt .frame{flex:0 0 80%;height:64px}
.opt .in{gap:12px;padding:0 46px;font-size:clamp(17px,2.2vw,30px);font-weight:700;color:#fff;transition:.2s}
.opt .dm{font-style:normal;font-size:11px;color:#fff}
.opt:hover:not(:disabled) .in{filter:brightness(1.5)}
.opt.sel,.opt.locked,.opt.correct,.opt.wrong{background:none;border:0}
.opt.sel .in,.opt.locked .in{background:linear-gradient(#ffb74d,#e07f10);color:#2a1500}
.opt.sel b,.opt.locked b,.opt.sel .dm,.opt.locked .dm{color:#2a1500}
.opt.locked .in{animation:blink .5s infinite alternate}
.opt.correct .in{background:linear-gradient(#35d67d,#12803f);color:#fff}
.opt.wrong .in{background:linear-gradient(#ee4b5a,#9c1626);color:#fff}
.opt.correct b,.opt.wrong b{color:#fff}
@keyframes blink{from{filter:brightness(1)}to{filter:brightness(1.35)}}

/* وسائل المساعدة واللاعبين */
.ll{border:3px solid var(--sv);background:radial-gradient(#2c1f90,#0e0848)}
.pl{border:3px solid var(--sv);background:rgba(15,9,72,.92);border-radius:22px}
.pl.active{background:linear-gradient(#ffb74d,#e07f10);border-color:#ffe3b3}
.timer>i{background:var(--ora)}
.timer>i.low{background:#ff4b5c}
.step.cur{background:var(--ora);color:#2a1500}
.step.cur .n{color:#2a1500}
.step .n{color:var(--ora)}

/* السلم كدرج جانبي */
.ladder{position:fixed;left:0;top:64px;bottom:104px;width:270px;transform:translateX(-106%);transition:transform .3s;z-index:40;
  display:flex;background:rgba(10,6,50,.97);border:3px solid var(--sv);border-left:0;border-radius:0 16px 16px 0}
.ladder.open{transform:none}

@media (max-width:900px){
  .opt .frame{flex-basis:90%;height:58px}
  .opt .in{padding:0 40px}
  .frame.q{flex-basis:94%}
}

/* ================= v3: كل العناصر بنفس الاستايل ================= */
/* الكارت والنوافذ: إطار فضي بزوايا مشطوفة */
.card,.modal{position:relative;isolation:isolate;background:var(--silver);border:0;box-shadow:none;padding:38px;
  clip-path:polygon(40px 0,calc(100% - 40px) 0,100% 40px,100% calc(100% - 40px),calc(100% - 40px) 100%,40px 100%,0 calc(100% - 40px),0 40px)}
.card::before,.modal::before{content:"";position:absolute;inset:3px;z-index:-1;background:linear-gradient(160deg,#160e66,#0a0540);
  clip-path:polygon(38px 0,calc(100% - 38px) 0,100% 38px,100% calc(100% - 38px),calc(100% - 38px) 100%,38px 100%,0 calc(100% - 38px),0 38px)}

/* الأزرار واللاعبين: إطار فضي مدبب */
.ghost,.big,.pl{position:relative;isolation:isolate;border:0;border-radius:0;background:var(--silver);
  clip-path:polygon(var(--c,20px) 0,calc(100% - var(--c,20px)) 0,100% 50%,calc(100% - var(--c,20px)) 100%,var(--c,20px) 100%,0 50%)}
.ghost::before,.big::before,.pl::before{content:"";position:absolute;inset:3px;z-index:-1;background:var(--inb);
  clip-path:polygon(calc(var(--c,20px) - 1px) 0,calc(100% - var(--c,20px) + 1px) 0,100% 50%,calc(100% - var(--c,20px) + 1px) 100%,calc(var(--c,20px) - 1px) 100%,0 50%)}
.big{--c:36px;color:#2a1500;box-shadow:none}
.big::before{background:linear-gradient(#ffb74d,#e07f10)}
.big:hover:not(:disabled)::before{filter:brightness(1.12)}
.ghost{--c:16px;padding:8px 28px}
.pl{--c:22px;padding:6px 30px;min-width:112px}
.players{gap:8px}
.pl.active{background:var(--silver);border:0;box-shadow:none}
.pl.active::before{background:linear-gradient(#ffb74d,#e07f10)}
.ghost:hover:not(:disabled)::before,.pl:hover:not(:disabled)::before{filter:brightness(1.7)}

/* خانات الإدخال */
.prow{align-items:center;gap:10px}
.prow .frame,.rowlab .frame{flex:1;height:52px}
.rowlab .frame{flex:0 0 210px}
.prow .ghost{--c:14px;padding:0 20px;height:52px}
.sf>.in{padding:0 32px}
.sf input,.sf select{flex:1;width:100%;max-width:none;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:19px;padding:0;border-radius:0}
.sf select option{background:#0b0640;color:#fff}
.tips{border-radius:0;background:rgba(255,255,255,.06)}

/* السلم ظاهر على الجنب */
#game{grid-template-columns:1fr 250px;grid-template-areas:"top top" "main ladder" "foot foot"}
.ladder{position:static;transform:none!important;width:auto;background:none;border:0;border-radius:0;padding:0 8px 0 14px;gap:6px;
  overflow:auto;z-index:auto}
.step{position:relative;isolation:isolate;padding:0 28px;min-height:26px;max-height:46px;border-radius:0;background:var(--silver);color:#fff;font-size:15px;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
.step::before{content:"";position:absolute;inset:2px;z-index:-1;background:var(--inb);
  clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%)}
.step.cur{background:var(--silver);color:#2a1500}
.step.cur::before{background:linear-gradient(#ffb74d,#e07f10)}
.step.cur .n{color:#2a1500}
.step.done{color:#fff}
.step.done::before{background:linear-gradient(#1c8a50,#0c4b2a)}
.step.done .n{color:#bfffd9}
.step.fail{opacity:.4}

/* وسائل المساعدة: ميداليات مضيئة */
.lifelines{gap:18px}
.ll{position:relative;width:auto;min-width:0;height:auto;border:0;border-radius:0;background:none;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.ll .ring{width:64px;height:64px;border-radius:50%;padding:3px;display:grid;place-items:center;transition:.25s;
  background:conic-gradient(from 200deg,#fafafd,#8b8b9c,#ececf3,#8b8b9c,#fafafd)}
.ll .core{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:var(--ora);
  background:radial-gradient(circle at 50% 25%,#4630bb,#0d0746 72%)}
.ll svg{width:32px;height:32px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px rgba(245,154,35,.85))}
.ll small{font-size:11px;font-weight:800;color:#fff}
.ll:not(:disabled):not(.used) .ring{animation:glow 1.8s infinite alternate}
.ll:hover:not(:disabled) .ring{transform:translateY(-3px) scale(1.08);box-shadow:0 0 26px rgba(245,154,35,.95)}
.ll:hover:not(:disabled){box-shadow:none}
.ll:disabled:not(.used){opacity:.4}
.ll.used{opacity:1}
.ll.used .ring{filter:grayscale(1) brightness(.45)}
.ll.used small{opacity:.45}
.ll.used::after{inset:auto;top:0;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;
  background:none;font-size:58px;color:#ff4b5c;display:grid;place-items:center}
@keyframes glow{from{box-shadow:0 0 4px rgba(245,154,35,.3)}to{box-shadow:0 0 20px rgba(245,154,35,.85)}}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top .lifelines{margin:0;justify-self:center;justify-content:center}
.tools{display:flex;gap:10px;justify-self:end}
#game{grid-template-areas:"top top" "foot foot" "main ladder";grid-template-rows:auto auto 1fr}
@media (max-width:900px){.top{grid-template-columns:1fr}.brand{text-align:center}.tools{justify-self:center}}
.llwho{align-self:center;font-weight:700;font-size:12px;text-align:center;line-height:1.35;color:#ffe0b0;max-width:130px}
.llwho b{color:#fff;font-size:15px}
.pips{display:flex;gap:4px;justify-content:center;margin-top:3px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--ora)}
.pips i.x{background:#6a6a80;opacity:.55}
.pl.active .pips i{background:#2a1500}
.pl.active .pips i.x{background:#7a4a10;opacity:.5}
.logo-img{display:block;width:min(86%,430px);height:auto;margin:-8px auto 4px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.brand-img{display:block;height:96px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
@media (max-width:900px){.brand-img{height:84px;margin:0 auto}}
body{overflow-y:auto}
#game{height:auto;min-height:100vh}
.main{min-height:auto}
.qwrap{flex:1 0 auto}
.opt,.opts{flex:0 0 auto}
.actions{flex-wrap:wrap}
@media (max-width:900px){
  #game{grid-template-columns:1fr;grid-template-areas:"top" "foot" "main";grid-template-rows:auto auto 1fr}
  .ladder{display:none}
  .card,.modal{padding:30px 22px}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>

<script>

let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,v,when,slide){
  if(muted)return; const c=ac(); if(!c)return;
  const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v||.15,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
const SFX={
  tick:()=>tone(900,.06,'square',.05),
  pick:()=>tone(660,.12,'triangle',.15),
  buzz:()=>tone(140,.5,'sawtooth',.18,0,70),
  lock:()=>{tone(120,.3,'sine',.4);},
  suspense:()=>[0,.6,1.2,1.8].forEach(w=>tone(90,.32,'sine',.35,w)),
  right:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.2,i*.12)),
  wrong:()=>{tone(220,.7,'sawtooth',.18,0,70);},
  ll:()=>[784,988,1319].forEach((f,i)=>tone(f,.18,'sine',.16,i*.08)),
  win:()=>[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.15))
};

const MUS={on:false,timer:null,next:0,step:0,master:null,noise:null};
const M_ROOT=[55,43.65,65.41,49];
const M_CH=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,783.99],[392,493.88,587.33]];
const M_ARP=[0,1,2,1,0,1,2,1,0,1,2,1,2,1,0,1];
function mNote(f,t,d,type,v,slide){
  const c=AC,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+d+.05);
}
function mNoise(t,d,v,hp){
  const c=AC,s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  s.buffer=MUS.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(MUS.master);s.start(t);s.stop(t+d+.02);
}
function menuStep(st,t,sd){
  const bar=Math.floor(st/16)%4,p=st%16,roots=[55,43.65,36.71,41.2],chs=[[220,261.63,329.63],[174.61,220,261.63],[146.83,174.61,220],[164.81,207.65,246.94]];
  const root=roots[bar],ch=chs[bar];
  if(p===0){mNote(root*2,t,sd*15,'sawtooth',.09);mNote(root*4,t,sd*15,'triangle',.07);}   // نغمة ممتدة مشدودة
  if(p===0||p===3){mNote(110,t,.2,'sine',.8,38);}                                       // نبض القلب
  if(p%4===2)mNote(1900,t,.03,'square',.03);                                             // تكتكة الساعة
  if(p===8)mNote(ch[bar%3]*4,t,sd*6,'sine',.06);                                         // نغمة غامضة عالية
  if(p===10)mNote(ch[(bar+1)%3]*2,t,sd*4,'triangle',.05);
  if(bar===3&&p>=8)mNoise(t,sd*1.5,.03+(p-8)*.012,2500+(p-8)*600);                       // صعود التشويق
  if(bar===3&&p===15)mNote(ch[0]*2,t,sd*3,'sawtooth',.06);
}const Q_ROOT=[110,110,87.31,82.41],HI2=[880,880,698.46,830.61];
const Q_PAD=[[220,261.63,329.63],[220,261.63,329.63],[174.61,220,261.63],[164.81,207.65,246.94]];
function musicStep(st,t,sd){
  if(MUS.mode==='menu')return menuStep(st,t,sd);
  const b=Math.floor(st/16)%4,p=st%16;
  if(p===0||p===3)mNote(120,t,.2,'sine',.75,40);                         // نبض القلب
  if(p%4===2)mNoise(t,.03,.05,7500);                                      // تكتكة
  if(p%2===0)mNote(Q_ROOT[b],t,sd*1.3,'sawtooth',p===0?.15:.1);           // باص نابض
  if(p===0)Q_PAD[b].forEach(f=>mNote(f,t,sd*15,'triangle',.05));          // وتر ممتد
  if(p===8)mNote(HI2[b],t,sd*5,'sine',.08);                               // نغمة عالية متباعدة
  if(p===12&&b%2===1)mNote(HI2[b]*1.25,t,sd*3,'sine',.05);
  if(b===3&&p>=10)mNoise(t,sd*1.2,.04+(p-10)*.025,2500+(p-10)*500);       // تصاعد قبل إعادة الدورة
}function musicSched(){
  if(!MUS.on||!AC)return;
  const bpm=MUS.mode==='menu'?80:((S&&cfg.time&&S.left>0&&S.left<=8)?120:100),sd=60/bpm/4;
  while(MUS.next<AC.currentTime+.25){musicStep(MUS.step,MUS.next,sd);MUS.next+=sd;MUS.step++;}
}
function musicStart(mode){
  mode=mode||'game';if(MUS.on&&MUS.mode===mode)return;if(MUS.on)musicStop();if(muted)return;const c=ac();if(!c)return;MUS.mode=mode;
  if(!MUS.noise){const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=b;}
  MUS.master=c.createGain();MUS.master.gain.setValueAtTime(0.0001,c.currentTime);
  MUS.master.gain.linearRampToValueAtTime(1.1,c.currentTime+.4);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;
  const cp=c.createDynamicsCompressor();MUS.master.connect(lp);lp.connect(cp);cp.connect(c.destination);
  MUS.on=true;MUS.next=c.currentTime+.08;MUS.step=0;
  MUS.timer=setInterval(musicSched,60);musicSched();
}
function musicStop(){
  if(!MUS.on)return;MUS.on=false;clearInterval(MUS.timer);
  const m=MUS.master,c=AC;
  if(c&&m){m.gain.cancelScheduledValues(c.currentTime);m.gain.setValueAtTime(Math.max(.0001,m.gain.value),c.currentTime);
    m.gain.linearRampToValueAtTime(0.0001,c.currentTime+.25);setTimeout(()=>{try{m.disconnect();}catch(e){}},500);}
}
function syncMusic(){
  const g=view==='game'&&S&&S.phase==='idle'&&!S.modal&&!muted&&!S.timeUp;
  if(g)musicStart('game');else if(view==='setup'&&!muted)musicStart('menu');else musicStop();
}

function confetti(n){
  const cols=['#f7c948','#ff4b5c','#32d47b','#5ea0ff','#ffffff','#f08a1c'];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*fx.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
    s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rnd(0,cols.length-1)]});
  if(!fxRun){fxRun=true;requestAnimationFrame(stepFx);}
}
function stepFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);
    fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fctx.restore();});
  parts=parts.filter(p=>p.y<fx.height+30);
  if(parts.length)requestAnimationFrame(stepFx);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height);}
}

        <button class="opt ${optClass(k)}" data-act="opt" data-i="${k}" ${optDisabled(k)?'disabled':''}>
          <span class="frame"><span class="in"><i class="dm">◆</i><b>${LETTERS[k]}:</b><span>${esc(t)}</span></span></span></button>`).join('')}</div>
      <div class="actions">
        ${idle?`<button class="big" data-act="confirm" ${(S.active==null||S.sel==null)?'disabled':''}>✔ إجابة نهائية</button>
                <button class="ghost" data-act="reveal">اكشف الإجابة</button>`:''}
        ${done?`<button class="big" data-act="next">${last?'النتيجة النهائية 🏆':'السؤال التالي ◀'}</button>`:''}
      </div>
    </div>
    <div class="ladder ${S.ladderOpen?'open':''}">${ladder}</div>
    <div class="players">${S.players.map((p,i)=>`
      <button class="pl ${S.active===i?'active':''} ${S.out.has(i)?'out':''}" data-act="buzz" data-i="${i}"
        ${(!idle||S.out.has(i))?'disabled':''}>
        <div class="k">${i<9?fmt(i+1):''}</div><div class="nm">${esc(p.name)}</div><div class="sc">${fmt(p.score)}</div>
        <div class="pips">${['fifty','poll','call'].map(k=>`<i class="${p.used[k]?'x':''}"></i>`).join('')}</div>
      </button>`).join('')}</div>
  </div>${modalHTML()}`;
  updateTimerUI();syncMusic();
  if(S.modal&&S.modal.type==='poll')setTimeout(()=>{
    document.querySelectorAll('.bar i').forEach(el=>el.style.height=el.dataset.h+'%');
  },60);
}

/* ---------- النوافذ ---------- */
function modalHTML(){
  if(!S.modal)return '';
  if(S.modal.type==='poll'){
    return `<div class="ov"><div class="modal">
      <h2>📊 سؤال الجمهور</h2><div>رأي الجمهور في الإجابة الصحيحة</div>
      <div class="bars">${S.modal.data.map((p,k)=>`
        <div class="bar ${p==null?'gone':''}">${p==null?'':fmt(p)+'٪'}<i data-h="${p==null?0:p}"></i><span class="l">${LETTERS[k]}</span></div>`).join('')}</div>
      <button class="big" data-act="closemodal">حسنًا ✔</button></div></div>`;
  }
  if(S.modal.type==='call'){
    return `<div class="ov"><div class="modal">
      <h2>📞 اتصال بصديق</h2><div>اسألوا صديقكم — لديكم ٣٠ ثانية</div>
      <div class="callnum" id="callnum">${fmt(S.modal.left)}</div>
      <button class="big" data-act="closemodal">انتهى الاتصال ✔</button></div></div>`;
  }
  return '';
}
function closeModal(){
  if(callTmr){clearInterval(callTmr);callTmr=null;}
  S.modal=null;render();
}

/* ---------- وسائل المساعدة ---------- */
function useLL(name){
  const P=S.players[S.active];
  if(S.phase!=='idle'||!P||P.used[name])return;
  if(name==='fifty'){
    const wr=shuffle([0,1,2,3].filter(k=>k!==S.cur.c&&!S.elim.has(k)&&!S.wrong.has(k))).slice(0,2);
    wr.forEach(k=>S.elim.add(k));
    if(S.sel!=null&&S.elim.has(S.sel))S.sel=null;
    P.used.fifty=true;SFX.ll();setMsg('تم حذف إجابتين خاطئتين ✂️','good');render();
  }else if(name==='poll'){
    const remain=[0,1,2,3].filter(k=>!S.elim.has(k));
    const cp=remain.length<=2?rnd(60,82):rnd(42,68);
    const others=remain.filter(k=>k!==S.cur.c);
    let rest=100-cp;const w=others.map(()=>Math.random()+.2),sum=w.reduce((a,b)=>a+b,0);
    const data=[null,null,null,null];data[S.cur.c]=cp;
    others.forEach((k,i)=>{data[k]=i===others.length-1?rest:Math.min(rest,Math.round((100-cp)*w[i]/sum));rest-=data[k];});
    P.used.poll=true;SFX.ll();S.modal={type:'poll',data};render();
  }else if(name==='call'){
    P.used.call=true;SFX.ll();S.modal={type:'call',left:30};render();
    callTmr=setInterval(()=>{
      if(!S.modal||S.modal.type!=='call'){clearInterval(callTmr);callTmr=null;return;}
      S.modal.left--;
      const n=document.getElementById('callnum');
      if(n){n.textContent=fmt(Math.max(0,S.modal.left));n.classList.toggle('low',S.modal.left<=5);}
      if(S.modal.left>0&&S.modal.left<=5)SFX.tick();
      if(S.modal.left<=0){clearInterval(callTmr);callTmr=null;SFX.buzz();}
    },1000);
  }
}

/* ---------- سير اللعب ---------- */
function buzz(i){
  if(S.phase!=='idle'||S.out.has(i)||!S.players[i])return;
  S.active=i;SFX.pick();
  S.msg={text:`${S.players[i].name} يجيب… اختاروا الإجابة`,kind:'warn'};render();
}
function pick(k){
  if(S.phase!=='idle'||optDisabled(k))return;
  if(S.active==null){setMsg('اضغطوا أولًا على اسم من سيجيب 👇','warn');return;}
  S.sel=k;SFX.pick();
  S.msg={text:`${S.players[S.active].name} اختار ${LETTERS[k]} — هل هذه إجابته النهائية؟`,kind:'warn'};render();
}
function confirmAns(){
  if(S.phase!=='idle'||S.active==null||S.sel==null)return;
  S.phase='resolving';SFX.lock();SFX.suspense();
  S.msg={text:'إجابة نهائية... 🥁',kind:'warn'};render();
  setTimeout(resolve,2300);
}
function resolve(){
  if(!S||S.phase!=='resolving')return;
  const i=S.active,p=S.players[i],val=valOf(S.q);
  if(S.sel===S.cur.c){
    S.phase='won';p.score+=val;S.winners[S.q]=p.name;SFX.right();confetti(90);
    S.msg={text:`🎉 إجابة صحيحة! ${p.name} ربح ${fmt(val)} نقطة`,kind:'good'};
  }else{
    S.wrong.add(S.sel);S.out.add(i);S.active=null;S.sel=null;S.phase='idle';SFX.wrong();
    S.msg={text:`❌ إجابة خاطئة! خرج ${p.name} من السؤال — فليحاول بقية اللاعبين`,kind:'bad'};
    if(S.out.size>=S.players.length){reveal(true);return;}
  }
  render();
}
function reveal(auto){
  if(S.phase!=='idle'&&!auto)return;
  S.phase='revealed';S.winners[S.q]=null;S.active=null;S.sel=null;
  S.msg={text:`${auto?'لم يُجب أحد إجابة صحيحة! ':''}الإجابة الصحيحة: ${LETTERS[S.cur.c]} — ${S.cur.a[S.cur.c]}`,kind:'warn'};
  render();
}
function next(){
  if(S.phase!=='won'&&S.phase!=='revealed')return;
  if(S.q>=S.qs.length-1){endGame();return;}
  S.q++;loadQuestion();
}

/* ---------- النهاية ---------- */
function endGame(){
  stopTimer();musicStop();view='end';
  const sorted=S.players.slice().sort((a,b)=>b.score-a.score);
  const top=sorted[0].score,winners=sorted.filter(p=>p.score===top);
  const medals=['🥇','🥈','🥉'];
  app.innerHTML=`
  <div class="screen"><div class="card">
    <h1 class="logo">${top===0?'انتهت اللعبة':(winners.length>1?'تعادل! 🤝':'مبروك الفائز! 🏆')}</h1>
    <p class="sub">${top===0?'لم يُجب أحد إجابة صحيحة 😅':winners.map(w=>esc(w.name)).join(' و ')}</p>
    ${sorted.map((p,i)=>`<div class="rank ${p.score===top&&top>0?'first':''}">
      <span class="m">${medals[i]||fmt(i+1)}</span><span class="nm">${esc(p.name)}</span><span>${fmt(p.score)} نقطة</span></div>`).join('')}
    <button class="big" data-act="again">العبوا مجددًا بالفرق نفسها ◀</button>
    <button class="ghost" style="width:100%;margin-top:10px" data-act="newgame">فرق جديدة</button>
  </div></div>`;
  if(top>0){SFX.win();confetti(250);setTimeout(()=>confetti(150),900);}
}

/* ---------- الأحداث ---------- */
const actions={
  addp(){syncSetup();if(cfg.names.length<15){cfg.names.push('');renderSetup();}},
  delp(i){syncSetup();cfg.names.splice(+i,1);if(!cfg.names.length)cfg.names.push('');renderSetup();},
  start(){syncSetup();ac();startGame();},
  buzz(i){buzz(+i);},
  opt(i){pick(+i);},
  confirm(){confirmAns();},
  reveal(){reveal();},
  next(){next();},
  ll(n){useLL(n);},
  closemodal(){closeModal();},
  mute(){muted=!muted;if(view==='game')render();else{syncMusic();const b=document.getElementById('mbtn');if(b)b.textContent=muted?'🔇':'🔊';}},
  ladder(){S.ladderOpen=!S.ladderOpen;render();},
  end(){if(confirm('هل تريد إنهاء اللعبة وعرض النتيجة؟'))endGame();},
  again(){ac();cfg.names=S.players.map(p=>p.name);startGame();},
  newgame(){renderSetup();}
};
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const f=actions[b.dataset.act];
  if(f)f(b.dataset.i);
});
addEventListener('keydown',e=>{
  if(view!=='game'||!S||S.modal)return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;
  if(/^[1-9]$/.test(e.key)){buzz(+e.key-1);return;}
  if(e.key==='Enter'){
    if(S.phase==='idle')confirmAns();else if(S.phase==='won'||S.phase==='revealed')next();
  }
});

renderSetup();
})();
</script>
</body>
</html>
